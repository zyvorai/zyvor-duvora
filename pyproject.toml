[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duvora"
version = "0.5.0"
description = "One control plane for DPU inventory, service plans, policies, and evidence"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Zyvor AI Labs"}]
dependencies = []

[project.scripts]
duvoractl = "duvora.cli:main"
duvora = "duvora.server:main"
duvora-agent = "duvora.agent:main"

[tool.setuptools.package-data]
duvora = ["static/*", "static/assets/*"]
"duvora.bpf" = ["obj/*.o"]

[tool.setuptools.packages.find]
include = ["duvora", "duvora.*"]
namespaces = false
