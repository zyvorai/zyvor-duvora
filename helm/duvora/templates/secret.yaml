{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "duvora.secretName" . }}
  labels:
    {{- include "duvora.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ required "auth.adminPassword is required" .Values.auth.adminPassword | quote }}
  {{- with .Values.auth.keys }}
  keys.json: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.netra.url (not .Values.netra.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "duvora.name" . }}-netra
  labels:
    {{- include "duvora.labels" . | nindent 4 }}
type: Opaque
stringData:
  netra-api-key: {{ required "netra.apiKey is required when netra.url is set" .Values.netra.apiKey | quote }}
  {{- with .Values.netra.caCert }}
  netra-ca.crt: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.agent.keys (not .Values.agent.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "duvora.agentSecretName" . }}
  labels:
    {{- include "duvora.labels" . | nindent 4 }}
type: Opaque
stringData:
  agent-keys.json: {{ toJson .Values.agent.keys | quote }}
{{- end }}
{{- if and .Values.ai.url .Values.ai.key (not .Values.ai.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ai
  labels:
    {{- include "duvora.labels" . | nindent 4 }}
type: Opaque
stringData:
  ai-api-key: {{ .Values.ai.key | quote }}
{{- end }}
{{- if and (include "duvora.integrationsEnabled" .) (not .Values.integrationsSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "duvora.integrationsSecretName" . }}
  labels:
    {{- include "duvora.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.siem.key }}
  siem-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.notify.key }}
  notify-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.scan.registryToken }}
  registry-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.agentIdentity.agentCaCert }}
  agent-ca.crt: {{ . | quote }}
  {{- end }}
  {{- with .Values.siem.caCert }}
  siem-ca.crt: {{ . | quote }}
  {{- end }}
  {{- with .Values.scan.caCert }}
  scan-ca.crt: {{ . | quote }}
  {{- end }}
  {{- with .Values.intel.caCert }}
  intel-ca.crt: {{ . | quote }}
  {{- end }}
  {{- with .Values.notify.caCert }}
  notify-ca.crt: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.tls.enabled (not .Values.tls.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "duvora.tlsSecretName" . }}
  labels:
    {{- include "duvora.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ required "tls.cert is required when tls.enabled" .Values.tls.cert | quote }}
  tls.key: {{ required "tls.key is required when tls.enabled" .Values.tls.key | quote }}
{{- end }}
