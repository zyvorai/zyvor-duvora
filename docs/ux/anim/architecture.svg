<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="Architecture: console, CLI and agents talk to one authenticated API backed by SQLite state and audit">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b0d"/><stop offset="1" stop-color="#16161a"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f5f5f7;text-anchor:middle}.s{font-size:12px;fill:#a1a1a6}.h{font-size:15px;font-weight:600}</style>
</defs>
<rect width="960" height="380" rx="20" fill="url(#bg)"/>
<g fill="#1c1c1e" stroke="#3a3a3c">
<rect x="40" y="60" width="200" height="56" rx="12"/><rect x="40" y="140" width="200" height="56" rx="12"/><rect x="40" y="220" width="200" height="56" rx="12"/><rect x="40" y="300" width="200" height="56" rx="12"/>
<rect x="720" y="60" width="200" height="56" rx="12"/><rect x="720" y="140" width="200" height="56" rx="12"/><rect x="720" y="220" width="200" height="56" rx="12"/>
</g>
<rect x="340" y="120" width="280" height="140" rx="18" fill="#1c1c1e" stroke="#2997ff" stroke-width="2"/>
<g><text x="140" y="94" class="h">React console</text><text x="140" y="174" class="h">duvoractl CLI</text><text x="140" y="254" class="h">PCI / DPF bridges</text><text x="140" y="334" class="h">duvora-agent (eBPF)</text></g>
<g><text x="480" y="170" class="h">Authenticated API</text><text x="480" y="192" class="s">plans · jobs · steering · AI analysis</text><text x="480" y="216" class="s">expiring actor-bound plans</text></g>
<g><text x="820" y="94" class="h">SQLite state + audit</text><text x="820" y="174" class="h">Reconciler + alerts</text><text x="820" y="254" class="h">Copilot (optional)</text></g>
<g fill="none" stroke="#48484a" stroke-width="2" stroke-dasharray="4 6">
<path id="a" d="M240 88 C290 88 290 160 340 160"/><path id="b" d="M240 168 H340"/><path id="c" d="M240 248 C290 248 290 200 340 200"/><path id="d" d="M240 328 C300 328 300 230 340 230"/>
<path id="e" d="M620 160 C670 160 670 88 720 88"/><path id="f" d="M620 190 H720 "/><path id="g" d="M620 225 C670 225 670 248 720 248"/>
</g>
<g fill="#2997ff" filter="url(#glow)">
<circle r="5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M240 88 C290 88 290 160 340 160"/></circle>
<circle r="5"><animateMotion dur="2.4s" begin=".4s" repeatCount="indefinite" path="M240 168 H340"/></circle>
<circle r="5"><animateMotion dur="2.4s" begin=".8s" repeatCount="indefinite" path="M240 248 C290 248 290 200 340 200"/></circle>
<circle r="5" fill="#30d5c8"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M240 328 C300 328 300 230 340 230"/></circle>
<circle r="5" fill="#30d5c8"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M620 160 C670 160 670 88 720 88"/></circle>
<circle r="5" fill="#30d5c8"><animateMotion dur="2.4s" begin="2s" repeatCount="indefinite" path="M620 190 H720"/></circle>
</g>
<text x="480" y="310" class="s">Observations stay separate from simulated desired state. Rollback never overwrites later changes.</text>
</svg>
